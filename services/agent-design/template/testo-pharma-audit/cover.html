<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Testo Audit Ready Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --audit-green: #059669;
      --audit-bg: #F0FDF4;
      --audit-text: #064E3B;
      --audit-border: #BBF7D0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #e9e9e9;
      font-family: "Inter", sans-serif;
    }

    .stage {
      min-height: 1350px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
      margin: 0;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--audit-bg);
      background-image:
        linear-gradient(to right, #DCFCE7 1px, transparent 1px),
        linear-gradient(to bottom, #DCFCE7 1px, transparent 1px);
      background-size: 80px 80px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 108px;
    }

    .stamp {
      position: absolute;
      top: 96px;
      right: 96px;
      border: 3px dashed var(--audit-green);
      border-radius: 12px;
      padding: 12px 24px;
      color: var(--audit-green);
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.08em;
      transform: rotate(-3deg);
      background: rgba(240, 253, 244, 0.9);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.15);
      z-index: 5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0 28px;
      height: 56px;
      background: var(--audit-green);
      border-radius: 8px;
      width: fit-content;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.25);
    }

    .badge span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .headline {
      margin: 48px 0 0;
      max-width: 840px;
      font-weight: 800;
      font-size: 64px;
      line-height: 1.15;
      color: var(--audit-text);
    }

    .body-card {
      margin: 36px 0 0;
      max-width: 860px;
      background: #FFFFFF;
      border: 2px solid var(--audit-border);
      border-top: 6px solid var(--audit-green);
      border-radius: 16px;
      padding: 36px;
      font-weight: 500;
      font-size: 36px;
      line-height: 1.45;
      color: #047857;
      box-shadow: 0 10px 30px rgba(5, 150, 105, 0.08);
    }

    .illustration-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 340px;
    }

    .illustration-container img, .illustration-container svg {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .spacer { flex: 1; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--audit-border);
      padding-top: 28px;
    }

    .footer span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 26px;
      color: var(--audit-green);
    }

    .footer-brand img {
      height: 56px;
      width: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="post">
      <div class="stamp">✓ AUDIT-READY CERTIFIED</div>

      <div class="badge"><span>{{BADGE}}</span></div>

      <h1 class="headline">{{TITLE}}</h1>

      <div class="body-card body-text">{{BODY}}</div>

      <div class="spacer"></div>

      <div class="illustration-container">
        {{ILLUSTRATION}}
      </div>

      <div class="footer">
        <div class="footer-brand">{{FOOTER_LEFT}}</div>
        <span>{{PAGE_NUMBER}}</span>
      </div>
    </div>
  </div>
</body>

</html>
