<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #071521; color: #cff4fe; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box; }
    .badge { font-size: 20px; font-weight: 700; color: #06b6d4; background: rgba(6, 182, 212, 0.15); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(6, 182, 212, 0.3); }
    .title { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .bullets { font-size: 26px; color: #ecfeff; line-height: 1.6; background: #0e2a3f; padding: 30px; border-radius: 16px; border: 1px solid #164e63; margin-bottom: 20px; }
    .architecture-diagram { width: 100%; height: 500px; background: #0e2a3f; border-radius: 16px; border: 1px dashed #06b6d4; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #22d3ee; }
    .footer { font-size: 22px; color: #164e63; display: flex; justify-content: space-between; border-top: 1px solid #164e63; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="bullets">{{BODY}}</div>
    <div class="architecture-diagram">🏗️ SYSTEM ARCHITECTURE BLUEPRINT</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
