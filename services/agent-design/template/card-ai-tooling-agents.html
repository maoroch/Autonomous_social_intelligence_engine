<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #130a21; color: #fae8ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box; }
    .badge { font-size: 20px; font-weight: 700; color: #f0abfc; background: rgba(240, 171, 252, 0.15); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(240, 171, 252, 0.3); }
    .title { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .bullets { font-size: 26px; color: #fdf4ff; line-height: 1.6; background: #26103c; padding: 30px; border-radius: 16px; border: 1px solid #701a75; margin-bottom: 20px; }
    .screenshot-box { width: 100%; height: 500px; background: #26103c; border-radius: 16px; border: 1px solid #701a75; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .screenshot-box img { width: 100%; height: 100%; object-fit: cover; }
    .footer { font-size: 22px; color: #86198f; display: flex; justify-content: space-between; border-top: 1px solid #701a75; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="bullets">{{BODY}}</div>
    <div class="screenshot-box">{{SCREENSHOT_OR_ILLUSTRATION}}</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
