<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #09131a; color: #d1fae5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box; }
    .badge { font-size: 20px; font-weight: 700; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.3); }
    .title { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .bullets { font-size: 26px; color: #ecfdf5; line-height: 1.6; background: #11222c; padding: 30px; border-radius: 16px; border: 1px solid #065f46; margin-bottom: 20px; }
    .footer { font-size: 22px; color: #065f46; display: flex; justify-content: space-between; border-top: 1px solid #065f46; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="bullets">{{BODY}}</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
