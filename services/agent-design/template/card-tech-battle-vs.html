<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #14090b; color: #fecdd3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box; }
    .badge { font-size: 20px; font-weight: 700; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(244, 63, 94, 0.3); }
    .title { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .bullets { font-size: 26px; color: #ffe4e6; line-height: 1.6; background: #270d12; padding: 30px; border-radius: 16px; border: 1px solid #4c0519; margin-bottom: 20px; }
    .vs-box { width: 100%; height: 500px; background: #270d12; border-radius: 16px; border: 1px dashed #e11d48; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 900; color: #fb7185; }
    .footer { font-size: 22px; color: #9f1239; display: flex; justify-content: space-between; border-top: 1px solid #4c0519; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="bullets">{{BODY}}</div>
    <div class="vs-box">⚡ VS COMPARISON ENGINE</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
