<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Testo Pharma Compliance Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --compliance-blue: #2563EB;
      --compliance-navy: #0F172A;
      --compliance-bg: #F8FAFC;
      --compliance-border: #CBD5E1;
    }

    * { box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }

    html, body {
      margin: 0;
      padding: 0;
      background: #e9e9e9;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      min-height: 1350px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
      margin: 0;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--compliance-bg);
      background-image:
        linear-gradient(to right, #E2E8F0 1px, transparent 1px),
        linear-gradient(to bottom, #E2E8F0 1px, transparent 1px);
      background-size: 72px 72px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 108px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0 24px;
      height: 48px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid var(--compliance-blue);
      border-radius: 6px;
    }

    .badge span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--compliance-blue);
    }

    .headline {
      margin: 0 0 32px 0;
      font-weight: 800;
      font-size: 52px;
      line-height: 1.2;
      color: var(--compliance-navy);
    }

    .body-text {
      margin: 0;
      font-weight: 500;
      font-size: 34px;
      line-height: 1.5;
      color: #334155;
      background: #FFFFFF;
      border: 1px solid var(--compliance-border);
      border-left: 6px solid var(--compliance-blue);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }

    .illustration-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 320px;
    }

    .illustration-container img, .illustration-container svg {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .spacer { flex: 1; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--compliance-border);
      padding-top: 24px;
    }

    .footer span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 24px;
      color: #64748B;
    }

    .footer-brand img {
      height: 50px;
      width: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="post">
      <div class="header-bar">
        <div class="badge"><span>{{BADGE}}</span></div>
      </div>

      <h2 class="headline">{{TITLE}}</h2>

      <div class="body-text">{{BODY_HTML}}</div>

      <div class="spacer"></div>

      <div class="illustration-container">
        {{ILLUSTRATION}}
      </div>

      <div class="footer">
        <div class="footer-brand">{{FOOTER_LEFT}}</div>
        <span>{{PAGE_NUMBER}}</span>
      </div>
    </div>
  </div>
</body>

</html>
