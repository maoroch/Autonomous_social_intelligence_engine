<svg width="160" height="110" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="80" cy="102" rx="55" ry="6" fill="rgba(99,102,241,0.10)"/>
  <!-- chart background -->
  <rect x="18" y="20" width="124" height="72" rx="6" fill="#0f1628" stroke="#1e2a5e" stroke-width="1.5"/>
  <!-- grid lines -->
  <line x1="18" y1="38" x2="142" y2="38" stroke="#1e2a5e" stroke-width="0.5"/>
  <line x1="18" y1="56" x2="142" y2="56" stroke="#1e2a5e" stroke-width="0.5"/>
  <line x1="18" y1="74" x2="142" y2="74" stroke="#1e2a5e" stroke-width="0.5"/>
  <!-- metric line 1 - requests -->
  <polyline points="28,70 45,58 60,62 75,42 90,48 105,35 120,40 132,30" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>
  <!-- metric line 2 - errors -->
  <polyline points="28,80 45,78 60,82 75,76 90,80 105,74 120,78 132,72" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,2"/>
  <!-- area fill under line 1 -->
  <polyline points="28,70 45,58 60,62 75,42 90,48 105,35 120,40 132,30 132,90 28,90" fill="rgba(99,102,241,0.08)" stroke="none"/>
  <!-- spike dot -->
  <circle cx="105" cy="35" r="3.5" fill="#6366f1"/>
  <circle cx="105" cy="35" r="6" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <!-- legend -->
  <line x1="24" y1="84" x2="34" y2="84" stroke="#6366f1" stroke-width="2"/>
  <text x="37" y="87" font-size="6.5" fill="#6b7280" font-family="sans-serif">requests</text>
  <line x1="72" y1="84" x2="82" y2="84" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="85" y="87" font-size="6.5" fill="#6b7280" font-family="sans-serif">errors</text>
  <!-- y-axis labels -->
  <text x="14" y="42" font-size="6" fill="#374151" font-family="monospace" text-anchor="end">1k</text>
  <text x="14" y="60" font-size="6" fill="#374151" font-family="monospace" text-anchor="end">500</text>
  <text x="14" y="78" font-size="6" fill="#374151" font-family="monospace" text-anchor="end">0</text>
</svg>
