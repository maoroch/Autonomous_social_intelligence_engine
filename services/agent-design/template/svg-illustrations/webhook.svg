<svg width="160" height="110" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="wh1" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#6366f1"/>
    </marker>
    <marker id="wh2" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#10b981"/>
    </marker>
  </defs>
  <ellipse cx="80" cy="102" rx="55" ry="6" fill="rgba(99,102,241,0.10)"/>
  <!-- source event -->
  <rect x="10" y="44" width="36" height="22" rx="5" fill="#1e1035" stroke="#6366f1" stroke-width="1.5"/>
  <text x="28" y="53" text-anchor="middle" font-size="6" fill="#818cf8" font-family="monospace">EVENT</text>
  <text x="28" y="62" text-anchor="middle" font-size="6.5" fill="#c084fc" font-family="monospace">fired</text>
  <!-- lightning bolt -->
  <path d="M52 50 L62 40 L58 53 L68 45 L56 68 L60 53 Z" fill="#f59e0b"/>
  <!-- webhook hub -->
  <circle cx="82" cy="55" r="16" fill="#0f1628" stroke="#6366f1" stroke-width="2"/>
  <text x="82" y="52" text-anchor="middle" font-size="7" fill="#818cf8" font-family="monospace">web</text>
  <text x="82" y="62" text-anchor="middle" font-size="7" fill="#818cf8" font-family="monospace">hook</text>
  <!-- pulse rings -->
  <circle cx="82" cy="55" r="22" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <circle cx="82" cy="55" r="28" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.15"/>
  <!-- outgoing webhooks -->
  <path d="M98 47 L118 32" stroke="#10b981" stroke-width="1.5" marker-end="url(#wh2)"/>
  <path d="M98 55 L120 55" stroke="#10b981" stroke-width="1.5" marker-end="url(#wh2)"/>
  <path d="M98 63 L118 76" stroke="#10b981" stroke-width="1.5" marker-end="url(#wh2)"/>
  <!-- destination services -->
  <rect x="120" y="24" width="30" height="16" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="135" y="34" text-anchor="middle" font-size="6" fill="#34d399" font-family="monospace">Slack</text>
  <rect x="122" y="47" width="30" height="16" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="137" y="57" text-anchor="middle" font-size="6" fill="#34d399" font-family="monospace">DB</text>
  <rect x="120" y="69" width="30" height="16" rx="4" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="135" y="79" text-anchor="middle" font-size="6" fill="#34d399" font-family="monospace">Email</text>
  <!-- payload label -->
  <rect x="8" y="72" width="56" height="12" rx="3" fill="#0f1628" stroke="#374151" stroke-width="1"/>
  <text x="36" y="80" text-anchor="middle" font-size="6" fill="#6b7280" font-family="monospace">POST /webhook</text>
</svg>
