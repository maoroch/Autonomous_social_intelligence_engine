<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover Style 3 - Cyberpunk Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00F5FF;
      --neon-green: #10B981;
      --dark-bg: #0D1117;
      --card-bg: #161B22;
      --border-color: #30363D;
      --ink: #E6EDF3;
      --muted: #8B949E;
    }
    * { box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }
    html, body {
      margin: 0; padding: 0;
      background: var(--dark-bg);
      font-family: "Outfit", sans-serif;
    }
    .stage {
      min-height: 1350px;
      display: flex;
      padding: 0; margin: 0;
    }
    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--dark-bg);
      background-image: radial-gradient(#30363D 1px, transparent 1px);
      background-size: 32px 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 120px 96px 96px;
    }
    .terminal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px 12px 0 0;
      margin-bottom: -1px;
    }
    .dot { width: 16px; height: 16px; border-radius: 50%; }
    .dot-red { background: #FF5F56; }
    .dot-yellow { background: #FFBD2E; }
    .dot-green { background: #27C93F; }
    .terminal-title {
      font-family: "Fira Code", monospace;
      font-size: 24px;
      color: var(--muted);
      margin-left: 12px;
    }
    .terminal-body {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0 0 16px 16px;
      padding: 60px 64px;
      display: flex;
      flex-direction: column;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 12px 28px;
      border-radius: 8px;
      background: rgba(0, 245, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.2);
      width: fit-content;
    }
    .badge span {
      font-family: "Fira Code", monospace;
      font-weight: 700;
      font-size: 36px;
      color: var(--neon-cyan);
      line-height: 1;
    }
    .headline {
      margin: 44px 0 0;
      font-weight: 800;
      font-size: 64px;
      line-height: 1.15;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }
    .body-text {
      margin: 28px 0 0;
      font-size: 40px;
      line-height: 1.4;
      color: var(--ink);
    }
    .illustration-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 320px;
    }
    .illustration-container svg { height: 100%; width: auto; }
    .spacer { flex: 1 1 auto; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 32px;
      margin-top: 24px;
    }
    .footer span {
      font-family: "Fira Code", monospace;
      font-size: 32px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="post">
      <div class="terminal-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span class="terminal-title">~/dev/insights.sh</span>
      </div>
      <div class="terminal-body">
        <div class="badge"><span>$ {{BADGE}}</span></div>
        <h1 class="headline">{{TITLE}}</h1>
        <p class="body-text">{{BODY}}</p>
        <div class="spacer"></div>
        <div class="illustration-container">{{ILLUSTRATION}}</div>
        <div class="footer">
          <span>{{FOOTER_LEFT}}</span>
          <span>{{PAGE_NUMBER}}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
