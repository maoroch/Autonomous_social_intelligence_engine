<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #0f172a; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }
    .badge { font-size: 20px; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.15); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.3); }
    .title { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .code-box { font-family: "Fira Code", monospace; font-size: 24px; color: #f8fafc; line-height: 1.6; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 20px; }
    .footer { font-size: 22px; color: #475569; display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="code-box">{{BODY}}</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
