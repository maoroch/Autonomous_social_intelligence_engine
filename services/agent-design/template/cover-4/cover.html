<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover Style 4 - Blueprint Architect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --accent: #FACC15;
      --grid: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.18);
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: "Space Grotesk", sans-serif;
    }
    .stage {
      min-height: 1350px;
      display: flex;
      padding: 0; margin: 0;
    }
    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 60px 60px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 140px 96px 96px;
    }
    .corner-cross {
      position: absolute;
      color: var(--accent);
      font-size: 32px;
      font-weight: 300;
      line-height: 1;
    }
    .top-left { top: 40px; left: 40px; }
    .top-right { top: 40px; right: 40px; }
    .bottom-left { bottom: 40px; left: 40px; }
    .bottom-right { bottom: 40px; right: 40px; }
    
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 24px;
      border-radius: 4px;
      background: var(--accent);
      width: fit-content;
    }
    .badge span {
      font-weight: 700;
      font-size: 34px;
      color: #0F172A;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .headline {
      margin: 48px 0 0;
      font-weight: 700;
      font-size: 64px;
      line-height: 1.15;
      color: var(--text);
    }
    .body-text {
      margin: 32px 0 0;
      font-size: 42px;
      line-height: 1.4;
      color: var(--muted);
    }
    .illustration-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 340px;
    }
    .illustration-container svg { height: 100%; width: auto; }
    .spacer { flex: 1 1 auto; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 32px;
    }
    .footer span {
      font-size: 34px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="post">
      <div class="corner-cross top-left">+</div>
      <div class="corner-cross top-right">+</div>
      <div class="corner-cross bottom-left">+</div>
      <div class="corner-cross bottom-right">+</div>

      <div class="badge"><span>{{BADGE}}</span></div>
      <h1 class="headline">{{TITLE}}</h1>
      <p class="body-text">{{BODY}}</p>

      <div class="spacer"></div>

      <div class="illustration-container">{{ILLUSTRATION}}</div>

      <div class="footer">
        <span>{{FOOTER_LEFT}}</span>
        <span>{{PAGE_NUMBER}}</span>
      </div>
    </div>
  </div>
</body>
</html>
