<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Testo Cold Chain Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cold-cyan: #0891B2;
      --cold-bg: #ECFEFF;
      --cold-card-bg: #FFFFFF;
      --cold-text: #083344;
      --cold-border: #A5F3FC;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #e9e9e9;
      font-family: "Inter", sans-serif;
    }

    .stage {
      min-height: 1350px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
      margin: 0;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background: radial-gradient(circle at top right, #CFFAFE 0%, #ECFEFF 60%, #F0FDFA 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 108px;
    }

    .temp-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #083344;
      color: #06B6D4;
      padding: 14px 28px;
      border-radius: 40px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 48px;
      box-shadow: 0 8px 24px rgba(8, 51, 68, 0.15);
    }

    .temp-scale {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #67E8F9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0 32px;
      height: 56px;
      background: linear-gradient(135deg, #0891B2, #06B6D4);
      border-radius: 28px;
      width: fit-content;
      box-shadow: 0 8px 24px rgba(8, 145, 178, 0.35);
    }

    .badge span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .headline {
      margin: 40px 0 0;
      max-width: 840px;
      font-weight: 800;
      font-size: 64px;
      line-height: 1.15;
      color: var(--cold-text);
    }

    .body-card {
      margin: 36px 0 0;
      max-width: 860px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid var(--cold-border);
      border-radius: 16px;
      padding: 36px;
      font-weight: 500;
      font-size: 36px;
      line-height: 1.45;
      color: #155E75;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.1);
    }

    .illustration-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 340px;
    }

    .illustration-container img, .illustration-container svg {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .spacer { flex: 1; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--cold-border);
      padding-top: 28px;
    }

    .footer span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 26px;
      color: #0891B2;
    }

    .footer-brand img {
      height: 56px;
      width: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="post">
      <div class="temp-bar">
        <span>❄️ COLD CHAIN MONITORING</span>
        <div class="temp-scale">
          <span>-20°C</span>
          <span>─── 🌡️ ───</span>
          <span>+8°C</span>
        </div>
      </div>

      <div class="badge"><span>{{BADGE}}</span></div>

      <h1 class="headline">{{TITLE}}</h1>

      <div class="body-card body-text">{{BODY}}</div>

      <div class="spacer"></div>

      <div class="illustration-container">
        {{ILLUSTRATION}}
      </div>

      <div class="footer">
        <div class="footer-brand">{{FOOTER_LEFT}}</div>
        <span>{{PAGE_NUMBER}}</span>
      </div>
    </div>
  </div>
</body>

</html>
