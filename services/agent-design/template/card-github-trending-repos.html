<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box; }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 20px; font-weight: 700; color: #58a6ff; background: rgba(88, 166, 255, 0.12); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(88, 166, 255, 0.25); }
    .title { font-size: 52px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .bullets { font-size: 26px; color: #c9d1d9; line-height: 1.6; background: #161b22; padding: 30px; border-radius: 16px; border: 1px solid #30363d; margin-bottom: 20px; }
    .screenshot-box { width: 100%; height: 520px; background: #161b22; border-radius: 14px; border: 1px solid #30363d; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .screenshot-box img { width: 100%; height: 100%; object-fit: cover; }
    .footer { font-size: 22px; color: #8b949e; display: flex; justify-content: space-between; border-top: 1px solid #30363d; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="header">
      <div class="badge">{{BADGE}}</div>
    </div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="bullets">{{BODY}}</div>
    <div class="screenshot-box">{{SCREENSHOT_OR_ILLUSTRATION}}</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
