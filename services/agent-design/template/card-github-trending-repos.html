<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Style 8 - GitHub Repos Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D1117;
      --card-bg: #161B22;
      --border: #30363D;
      --blue: #58A6FF;
      --green: #3FB950;
      --gold: #D29922;
      --text: #F0F6FC;
      --muted: #8B949E;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: "Outfit", sans-serif;
    }
    .stage {
      min-height: 1350px;
      display: flex;
      padding: 0; margin: 0;
    }
    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(48, 54, 61, 0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(48, 54, 61, 0.4) 1px, transparent 1px);
      background-size: 48px 48px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 88px;
    }
    .repo-card {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 64px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .headline {
      margin: 0;
      font-weight: 900;
      font-size: 64px;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .body-text {
      margin: 24px 0 0;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--muted);
      max-height: 224px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
    }
    .illustration-container {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 500px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0d1117;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .browser-frame {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0d1117;
    }
    .browser-header {
      height: 38px;
      background: #161b22;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }
    .browser-dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .browser-url-text {
      margin-left: 12px;
      background: #0d1117;
      border-radius: 6px;
      padding: 4px 14px;
      font-family: "Fira Code", monospace;
      font-size: 16px;
      color: #8b949e;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .browser-body {
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    .browser-body img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
    }
    .illustration-container svg { height: 100%; width: auto; }
    .spacer { flex: 1 1 auto; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 28px;
      margin-top: auto;
    }
    .footer span {
      font-family: "Fira Code", monospace;
      font-size: 30px;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="post">
      <div class="repo-card">
        <h1 class="headline">{{TITLE}}</h1>
        <p class="body-text">{{BODY}}</p>
        <div class="spacer"></div>
        <div class="illustration-container">{{ILLUSTRATION}}</div>
        <div class="footer">
          <span>{{FOOTER_LEFT}}</span>
          <span>{{PAGE_NUMBER}}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
