<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');

    * {
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      background: #08090C;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Cinematic Scene Backdrop */
    .backdrop-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 850px;
      z-index: 1;
      overflow: hidden;
    }

    .backdrop-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: brightness(0.88) contrast(1.1);
      transform: scale(1.03);
    }

    .backdrop-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg,
          rgba(8, 9, 12, 0.45) 0%,
          rgba(8, 9, 12, 0) 40%,
          rgba(8, 9, 12, 0.75) 70%,
          #08090C 100%);
    }

    /* Content Layout */
    .content-wrapper {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      padding: 60px 65px;
    }

    /* Top Header with Brand Adapted Elements */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo-pill {
      display: flex;
      align-items: center;
      background: rgba(10, 12, 18, 0.88);
      border: 1px solid rgba(255, 184, 0, 0.4);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 40px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .brand-logo-pill img {
      height: 32px;
      width: auto;
      display: block;
    }

    .slide-chip {
      background: rgba(255, 184, 0, 0.15);
      border: 1px solid #FFB800;
      color: #FFB800;
      font-size: 16px;
      font-weight: 800;
      padding: 8px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(255, 184, 0, 0.25);
    }

    /* Mid Zoom Inspection Callout */
    .inspection-callout {
      align-self: flex-end;
      margin-top: 180px;
      background: rgba(15, 17, 26, 0.92);
      border: 2px solid #FFB800;
      border-radius: 12px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(255, 184, 0, 0.35);
      backdrop-filter: blur(20px);
    }

    .crosshair-icon {
      font-size: 22px;
    }

    .callout-text {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Bottom Info Card */
    .bottom-section {
      background: linear-gradient(180deg, rgba(16, 18, 28, 0.96) 0%, rgba(10, 11, 16, 0.98) 100%);
      border: 1px solid rgba(255, 184, 0, 0.25);
      border-left: 6px solid #FFB800;
      border-radius: 24px;
      padding: 38px 40px;
      backdrop-filter: blur(30px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    }

    .category-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .cat-badge {
      background: #FFB800;
      color: #08090C;
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .cat-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #E2E8F0;
      font-weight: 700;
    }

    .headline {
      font-family: 'Oswald', sans-serif;
      font-size: 56px;
      line-height: 1.12;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    .headline span.gold {
      color: #FFB800;
      background: linear-gradient(90deg, #FFE600 0%, #FFA000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .summary-text {
      font-size: 21px;
      line-height: 1.5;
      color: #CBD5E1;
      font-weight: 400;
      margin-bottom: 26px;
    }

    /* Footer Action with Gold CTA Button */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .swipe-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #FFB800 0%, #FFA000 100%);
      color: #08090C;
      font-size: 18px;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(255, 184, 0, 0.35);
    }

    .swipe-btn svg {
      width: 18px;
      height: 18px;
      fill: #08090C;
    }

    .brand-footer img {
      height: 24px;
      width: auto;
      display: block;
    }
  </style>
</head>

<body>
  <!-- Scene Backdrop Photo -->
  <div class="backdrop-container">
    <img class="backdrop-image"
      src="{{BACKDROP_IMAGE}}"
      alt="Movie Scene" />
    <div class="backdrop-gradient"></div>
  </div>

  <div class="content-wrapper">
    <!-- Top Header with Brand Pill and Gold Chip -->
    <div class="header">
      <div class="brand-logo-pill">
        <img src="assets/kinopeek-logo.svg" alt="KinoPeek">
      </div>
      <div class="slide-chip">{{PAGE_TEXT}}</div>
    </div>

    <!-- Main Eye-Catching Bottom Card -->
    <div class="bottom-section">
      <div class="category-strip">
        <div class="cat-badge">{{BADGE}}</div>
        <div class="cat-meta">{{FOOTER_LEFT}}</div>
      </div>

      <h1 class="headline">
        {{TITLE}}
      </h1>

      <p class="summary-text">
        {{BODY}}
      </p>

      <div class="footer-bar">
        <div class="swipe-btn">
          Листать разбор
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="#08090C" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </div>
        <div class="brand-footer">
          <img src="assets/kinopeek-logo.svg" alt="KinoPeek">
        </div>
      </div>
    </div>
  </div>
</body>

</html>
