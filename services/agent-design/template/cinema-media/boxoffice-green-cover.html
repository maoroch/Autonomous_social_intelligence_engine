<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');

    * {
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      background: #06090D;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Movie Poster Hero Backdrop */
    .backdrop-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 850px;
      z-index: 1;
      overflow: hidden;
    }

    .backdrop-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      filter: brightness(0.85) contrast(1.15);
      transform: scale(1.03);
    }

    .backdrop-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg, 
        rgba(6, 9, 13, 0.45) 0%, 
        rgba(6, 9, 13, 0) 35%, 
        rgba(6, 9, 13, 0.8) 70%, 
        #06090D 100%
      );
    }

    .content-wrapper {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      padding: 60px 65px;
    }

    /* Header with SVG Logo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo-pill {
      display: flex;
      align-items: center;
      background: rgba(8, 12, 18, 0.88);
      border: 1px solid rgba(255, 184, 0, 0.4);
      padding: 8px 18px;
      border-radius: 40px;
      backdrop-filter: blur(15px);
    }

    .brand-logo-pill img {
      height: 32px;
      width: auto;
      display: block;
    }

    .ratings-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rating-chip {
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .rating-imdb { background: #FFB800; color: #000000; }
    .rating-rt { background: #FA320A; color: #FFFFFF; }

    /* Mid Live Gross Banner */
    .hero-numbers-strip {
      align-self: flex-end;
      margin-top: 170px;
      background: rgba(14, 18, 22, 0.92);
      border: 2px solid #FFB800;
      border-radius: 14px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(255, 184, 0, 0.35);
      backdrop-filter: blur(20px);
    }

    .money-icon { font-size: 26px; }
    .roi-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #FFB800;
      letter-spacing: 1px;
    }

    /* Bottom Info Card */
    .bottom-section {
      background: linear-gradient(180deg, rgba(14, 20, 28, 0.96) 0%, rgba(8, 11, 16, 0.98) 100%);
      border: 1px solid rgba(255, 184, 0, 0.25);
      border-left: 6px solid #FFB800;
      border-radius: 24px;
      padding: 38px 40px;
      backdrop-filter: blur(30px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    }

    .category-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .cat-badge {
      background: #FFB800;
      color: #08090C;
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .cat-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #E2E8F0;
      font-weight: 700;
    }

    .headline {
      font-family: 'Oswald', sans-serif;
      font-size: 56px;
      line-height: 1.12;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    .headline span.gold {
      color: #FFB800;
      background: linear-gradient(90deg, #FFE600 0%, #FFA000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Numbers Breakdown in card */
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .metric-item { display: flex; flex-direction: column; gap: 4px; }
    .metric-label { font-size: 13px; font-weight: 700; color: #8C96A8; text-transform: uppercase; }
    .metric-val { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; }
    .metric-val.red { color: #FF5252; }
    .metric-val.gold { color: #FFB800; }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .swipe-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #FFB800 0%, #FFA000 100%);
      color: #08090C;
      font-size: 18px;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(255, 184, 0, 0.35);
    }

    .swipe-btn svg { width: 18px; height: 18px; fill: #08090C; }

    .brand-footer img {
      height: 24px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Blockbuster Backdrop Scene -->
  <div class="backdrop-container">
    <img 
      class="backdrop-image" 
      src="{{BACKDROP_IMAGE}}" 
      alt="Blockbuster Cinema Scene"
    />
    <div class="backdrop-gradient"></div>
  </div>

  <div class="content-wrapper">
    <!-- Header with SVG Logo -->
    <div class="header">
      <div class="brand-logo-pill">
        <img src="assets/kinopeek-logo.svg" alt="KinoPeek">
      </div>
      <div class="ratings-group">
        <div class="rating-chip rating-imdb">★ 8.8</div>
        <div class="rating-chip rating-rt">🍅 96%</div>
      </div>
    </div>

    <!-- Live Gross Hook Callout -->
    <div class="hero-numbers-strip">
      <div class="money-icon">💰</div>
      <div class="roi-badge">ROI: +480% ЧИСТОЙ ПРИБЫЛИ</div>
    </div>

    <!-- Bottom Eye-Catching Card -->
    <div class="bottom-section">
      <div class="category-strip">
        <div class="cat-badge">КАССОВЫЕ СБОРЫ</div>
        <div class="cat-meta">РЕКОРД ГОДА</div>
      </div>

      <h1 class="headline">
        КАК БЛОКБАСТЕР ЗА $180M ПРЕВРАТИЛСЯ В <span class="gold">$1.4 МИЛЛИАРДА СБОРОВ</span>
      </h1>

      <div class="metrics-row">
        <div class="metric-item">
          <span class="metric-label">Бюджет + Маркетинг</span>
          <span class="metric-val red">$240,000,000</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Мировой Бокс-Офис</span>
          <span class="metric-val gold">$1,420,000,000</span>
        </div>
      </div>

      <div class="footer-bar">
        <div class="swipe-btn">
          Смотреть разбор
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#08090C" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-footer">
          <img src="assets/kinopeek-logo.svg" alt="KinoPeek">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
