<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');

    * {
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      background: #0A0A0D;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Backstage Scene Backdrop Photo */
    .backdrop-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 850px;
      z-index: 1;
      overflow: hidden;
    }

    .backdrop-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      filter: brightness(0.9) contrast(1.15) sepia(0.15);
      transform: scale(1.04);
    }

    .backdrop-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg, 
        rgba(10, 10, 13, 0.45) 0%, 
        rgba(10, 10, 13, 0) 35%, 
        rgba(10, 10, 13, 0.75) 68%, 
        #0A0A0D 100%
      );
    }

    .film-strip-top {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 16px;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.3) 4px, transparent 4px);
      background-size: 32px 16px;
      z-index: 2;
    }

    .content-wrapper {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      padding: 60px 65px;
    }

    /* Top Camera HUD with SVG Logo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo-pill {
      display: flex;
      align-items: center;
      background: rgba(15, 15, 20, 0.88);
      border: 1px solid rgba(255, 184, 0, 0.4);
      padding: 8px 18px;
      border-radius: 40px;
      backdrop-filter: blur(15px);
    }

    .brand-logo-pill img {
      height: 32px;
      width: auto;
      display: block;
    }

    .hud-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #FFB800;
      background: rgba(255, 184, 0, 0.12);
      border: 1px solid rgba(255, 184, 0, 0.4);
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
    }

    /* Mid Photo Callout */
    .backstage-callout {
      align-self: flex-start;
      margin-top: 190px;
      background: rgba(18, 17, 24, 0.9);
      border: 2px solid #FFB800;
      border-radius: 12px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(255, 184, 0, 0.35);
      backdrop-filter: blur(20px);
    }

    .callout-icon { font-size: 20px; }
    .callout-text {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Bottom Info Card */
    .bottom-section {
      background: linear-gradient(180deg, rgba(22, 21, 28, 0.96) 0%, rgba(12, 11, 16, 0.98) 100%);
      border: 1px solid rgba(255, 184, 0, 0.25);
      border-left: 6px solid #FFB800;
      border-radius: 24px;
      padding: 38px 40px;
      backdrop-filter: blur(30px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    }

    .category-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .cat-badge {
      background: #FFB800;
      color: #0E0D12;
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .cat-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #E2E8F0;
      font-weight: 700;
    }

    .headline {
      font-family: 'Oswald', sans-serif;
      font-size: 56px;
      line-height: 1.12;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    .headline span.gold {
      color: #FFB800;
      background: linear-gradient(90deg, #FFD700 0%, #FFA000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .summary-text {
      font-size: 21px;
      line-height: 1.5;
      color: #D6D5E0;
      font-weight: 400;
      margin-bottom: 26px;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .swipe-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFB800;
      color: #0E0D12;
      font-size: 18px;
      font-weight: 800;
      padding: 12px 26px;
      border-radius: 30px;
    }

    .swipe-btn svg { width: 18px; height: 18px; fill: #0E0D12; }

    .brand-footer img {
      height: 24px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="film-strip-top"></div>

  <!-- Real Film Production Scene Backdrop -->
  <div class="backdrop-container">
    <img 
      class="backdrop-image" 
      src="https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=1200&auto=format&fit=crop" 
      alt="Behind the scenes"
    />
    <div class="backdrop-gradient"></div>
  </div>

  <div class="content-wrapper">
    <!-- Header with SVG Logo -->
    <div class="header">
      <div class="brand-logo-pill">
        <img src="assets/kinopeek-logo.svg" alt="KinoPeek">
      </div>
      <div class="hud-meta">1/5 СЛАЙДОВ</div>
    </div>

    <!-- Live Photo Indicator -->
    <div class="backstage-callout">
      <div class="callout-icon">🎬</div>
      <div class="callout-text">СЪЕМКИ БЕЗ ЗЕЛЕНОГО ЭКРАНА</div>
    </div>

    <!-- Bottom Eye-Catching Card -->
    <div class="bottom-section">
      <div class="category-strip">
        <div class="cat-badge">ИСТОРИЯ КИНО</div>
        <div class="cat-meta">СЕКРЕТЫ РЕЖИССУРЫ</div>
      </div>

      <h1 class="headline">
        КАК КРИСТОФЕР НОЛАН ВЗОРВАЛ ЗДАНИЕ <span class="gold">БЕЗ ЕДИНОГО ГРАММА CGI</span>
      </h1>

      <p class="summary-text">
        Культовая сцена из «Темного рыцаря»: импровизация Хита Леджера, реальные 400 кг динамита и оператор с 12 камерами без права на второй дубль.
      </p>

      <div class="footer-bar">
        <div class="swipe-btn">
          Смотреть закулисье
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#0E0D12" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-footer">
          <img src="assets/kinopeek-logo.svg" alt="KinoPeek">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
