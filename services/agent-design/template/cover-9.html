<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover Style 9 - GitHub Pet Project Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --border: #334155;
      --cyan: #38BDF8;
      --rose: #F43F5E;
      --emerald: #10B981;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: "Outfit", sans-serif;
    }
    .stage {
      min-height: 1350px;
      display: flex;
      padding: 0; margin: 0;
    }
    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--bg);
      border: 12px solid #020617;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 96px;
    }
    .vault-card {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 28px;
      padding: 64px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      position: relative;
    }
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      font-family: "Fira Code", monospace;
      font-size: 24px;
      color: var(--cyan);
    }
    .tab {
      background: #0F172A;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 24px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--emerald);
      width: fit-content;
    }
    .badge span {
      font-family: "Fira Code", monospace;
      font-weight: 700;
      font-size: 32px;
      color: var(--emerald);
      text-transform: uppercase;
    }
    .headline {
      margin: 36px 0 0;
      font-weight: 900;
      font-size: 72px;
      line-height: 1.12;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .body-text {
      margin: 32px 0 0;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--muted);
    }
    .illustration-container {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 300px;
    }
    .illustration-container svg { height: 100%; width: auto; }
    .spacer { flex: 1 1 auto; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--border);
      padding-top: 28px;
      margin-top: 28px;
    }
    .footer span {
      font-family: "Fira Code", monospace;
      font-size: 32px;
      color: var(--cyan);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="post">
      <div class="vault-card">
        <div class="tab-bar">
          <div class="tab"><span>🛠️ PET_PROJECT_VAULT.ts</span></div>
        </div>
        <div class="badge"><span>{{BADGE}}</span></div>
        <h1 class="headline">{{TITLE}}</h1>
        <p class="body-text">{{BODY}}</p>
        <div class="spacer"></div>
        <div class="illustration-container">{{ILLUSTRATION}}</div>
        <div class="footer">
          <span>{{FOOTER_LEFT}}</span>
          <span>{{PAGE_NUMBER}}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
