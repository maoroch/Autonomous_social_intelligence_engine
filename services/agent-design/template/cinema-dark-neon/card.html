<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1350px;
      background: #0D0E12;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 70px;
      position: relative;
      overflow: hidden;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid #00D2FF;
      color: #00D2FF;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 8px;
      width: fit-content;
    }
    .headline {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.25;
      color: #FFFFFF;
      margin-top: 30px;
    }
    .bullets {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .bullet-item {
      background: #14171F;
      border-left: 4px solid #E23636;
      border-radius: 0 12px 12px 0;
      padding: 24px;
      font-size: 26px;
      line-height: 1.45;
      color: #E5E7EB;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 30px;
      font-size: 22px;
      color: #6B7280;
    }
    .footer-brand {
      color: #00D2FF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <div class="headline">{{TITLE}}</div>
    <div class="bullets">
      {{BODY}}
    </div>
  </div>
  <div class="footer">
    <div class="footer-brand">CINEMA HUB</div>
    <div>{{PAGE_TEXT}}</div>
  </div>
</body>
</html>
