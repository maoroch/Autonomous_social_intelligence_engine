<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1350px;
      background: #0D0E12;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 70px;
      position: relative;
      overflow: hidden;
    }
    .accent-glow {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(226, 54, 54, 0.25) 0%, rgba(13, 14, 18, 0) 70%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(226, 54, 54, 0.15);
      border: 1px solid #E23636;
      color: #E23636;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 8px;
      width: fit-content;
    }
    .headline {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.15;
      color: #FFFFFF;
      margin-top: 40px;
    }
    .headline span.highlight {
      color: #FFB800;
    }
    .body-text {
      font-size: 28px;
      line-height: 1.5;
      color: #9CA3AF;
      margin-top: 30px;
    }
    .illustration-container {
      width: 100%;
      height: 400px;
      background: rgba(20, 23, 31, 0.8);
      border: 1px solid rgba(226, 54, 54, 0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 30px;
      font-size: 22px;
      color: #6B7280;
    }
    .footer-brand {
      color: #00D2FF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="accent-glow"></div>
  <div>
    <div class="badge">{{BADGE}}</div>
    <div class="headline">{{TITLE}}</div>
    <div class="body-text" style="{{BODY_STYLE}}">{{BODY}}</div>
  </div>
  <div class="illustration-container">
    {{ILLUSTRATION}}
  </div>
  <div class="footer">
    <div class="footer-brand">CINEMA HUB</div>
    <div>{{PAGE_TEXT}}</div>
  </div>
</body>
</html>
