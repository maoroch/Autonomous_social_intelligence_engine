<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover Style 6 - Warm Editorial Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF9F5;
      --ink: #0F172A;
      --muted: #475569;
      --accent: #EA580C;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .stage {
      min-height: 1350px;
      display: flex;
      padding: 0; margin: 0;
    }
    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--bg);
      border: 12px solid #F1F5F9;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 120px 96px 96px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 26px;
      border-radius: 8px;
      background: #EA580C;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.25);
      width: fit-content;
    }
    .badge span {
      font-weight: 800;
      font-size: 32px;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .headline {
      margin: 44px 0 0;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 76px;
      line-height: 1.1;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .body-text {
      margin: 32px 0 0;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--muted);
    }
    .illustration-container {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 320px;
    }
    .illustration-container svg { height: 100%; width: auto; }
    .spacer { flex: 1 1 auto; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 3px solid var(--ink);
      padding-top: 32px;
    }
    .footer span {
      font-size: 36px;
      color: var(--ink);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="post">
      <div class="badge"><span>{{BADGE}}</span></div>
      <h1 class="headline">{{TITLE}}</h1>
      <p class="body-text">{{BODY}}</p>
      <div class="spacer"></div>
      <div class="illustration-container">{{ILLUSTRATION}}</div>
      <div class="footer">
        <span>{{FOOTER_LEFT}}</span>
        <span>{{PAGE_NUMBER}}</span>
      </div>
    </div>
  </div>
</body>
</html>
