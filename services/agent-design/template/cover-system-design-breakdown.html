<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #071521; color: #cff4fe; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 80px; box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }
    .badge { font-size: 22px; font-weight: 700; color: #06b6d4; text-transform: uppercase; letter-spacing: 2px; background: rgba(6, 182, 212, 0.15); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(6, 182, 212, 0.3); }
    .title-box { margin-top: 40px; }
    .title { font-size: 64px; font-weight: 800; line-height: 1.25; background: linear-gradient(135deg, #ffffff 40%, #22d3ee 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .bullets { font-size: 26px; color: #67e8f9; line-height: 1.6; margin-top: 30px; }
    .footer { font-size: 22px; color: #164e63; display: flex; justify-content: space-between; border-top: 1px solid #164e63; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <div class="title-box">
      <h1 class="title">{{TITLE}}</h1>
      <div class="bullets">{{BODY}}</div>
    </div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
