<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; width: 1080px; height: 1350px; background: #0f0c1b; color: #f3e8ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 75px; box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word; }
    .badge { font-size: 20px; font-weight: 700; color: #a855f7; background: rgba(168, 85, 247, 0.15); padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(168, 85, 247, 0.3); }
    .title { font-size: 48px; font-weight: 800; color: #ffffff; margin-top: 30px; margin-bottom: 20px; }
    .bullets { font-size: 26px; color: #faf5ff; line-height: 1.6; background: #1e1735; padding: 30px; border-radius: 16px; border: 1px solid #581c87; margin-bottom: 20px; }
    .footer { font-size: 22px; color: #6b21a8; display: flex; justify-content: space-between; border-top: 1px solid #581c87; padding-top: 25px; }
  </style>
</head>
<body>
  <div>
    <div class="badge">{{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="bullets">{{BODY}}</div>
  </div>
  <div class="footer">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{PAGE_TEXT}}</span>
  </div>
</body>
</html>
