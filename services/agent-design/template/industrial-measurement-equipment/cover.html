<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Testo Carousel Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Manrope:wght@600;700;800;900&subset=cyrillic,cyrillic-ext&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --testo-accent: {{ACCENT_COLOR}};
      --testo-ink: {{INK_COLOR}};
      --testo-paper: {{PAPER_COLOR}};
      --testo-orange: #FF7900;
      --testo-dark: #09090B;
      --testo-steel: #3F3F46;
      --testo-line: #E4E4E7;
    }

    * {
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      padding: 0;
      background: #F4F4F0;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      background: #F8F8F5;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 85px 80px 75px;
    }

    /* Ambient atmospheric studio lighting */
    .canvas::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -100px;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 121, 0, 0.16) 0%, rgba(255, 121, 0, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .canvas::after {
      content: "";
      position: absolute;
      bottom: 120px;
      left: -140px;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 180, 0, 0.12) 0%, rgba(255, 180, 0, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      position: relative;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 10px 24px;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .tag-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--testo-orange);
      box-shadow: 0 0 10px var(--testo-orange);
    }

    .tag-text {
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #18181B;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .issue-no {
      font-family: "IBM Plex Mono", monospace;
      font-size: 16px;
      font-weight: 700;
      color: #A1A1AA;
      letter-spacing: 0.05em;
    }

    /* Hero Section */
    .hero {
      z-index: 10;
      position: relative;
      margin-top: 36px;
    }

    .product-kicker {
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--testo-orange);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product-kicker::after {
      content: "";
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 121, 0, 0.4), rgba(255, 121, 0, 0.05));
    }

    .headline {
      font-family: "Manrope", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 75px;
      font-weight: 900;
      line-height: 1.08;
      color: var(--testo-dark);
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    /* Floating Frosted Glass Editorial Card */
    .editorial-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-left: 6px solid var(--testo-orange);
      border-radius: 28px;
      padding: 34px 38px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
      z-index: 10;
      position: relative;
      margin-top: 60px;
      margin-bottom: 24px;
    }

    .editorial-card p {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      color: var(--testo-steel);
      line-height: 1.42;
      letter-spacing: -0.01em;
    }

    /* Footer */
    .footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding-top: 26px;
      z-index: 10;
      position: relative;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      height: 56px;
    }

    .footer-brand img {
      height: 52px;
      max-height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .swipe-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #18181B;
      color: #FFFFFF;
      padding: 16px 32px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .swipe-arrow {
      font-size: 20px;
      color: var(--testo-orange);
    }

    /* Showcase Photo / Illustration Box */
    .illustration-container {
      width: 100%;
      height: 380px;
      margin-top: 36px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
    }

    .illustration-container img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .illustration-container svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 40px rgba(255, 121, 0, 0.15));
    }

    .content {
      z-index: 10;
      position: relative;
      display: flex;
      flex-direction: column;
      margin-top: 120px;
    }
  </style>
</head>

<body>

  <div class="canvas">
    <!-- Top Header -->
    <div class="header">
      <div class="tag-pill">
        <span class="tag-dot"></span>
        <span class="tag-text">{{BADGE}}</span>
      </div>
      <div class="issue-no">B2B CASE // {{PAGE_TEXT}}</div>
    </div>

    <div class="content">
      <!-- Hero Title -->
      <div class="hero">
        <div class="product-kicker">Testo Smart</div>
        <h1 class="headline">{{TITLE}}</h1>
      </div>

      <!-- Frosted Editorial Description Card -->
      <div class="editorial-card" style="{{BODY_STYLE}}">
        <p>{{BODY}}</p>
      </div>

      <!-- Device Photo / Illustration Showcase -->
      <div class="illustration-container" style="{{ILLUSTRATION_STYLE}}">
        {{ILLUSTRATION}}
      </div>
    </div>

    <!-- Footer with Logo and Swipe Pill -->
    <div class="footer">
      <div class="footer-brand">
        <img src="https://azia-test.com/wp-content/uploads/2025/02/logo.svg" alt="Azia Test" style="height: 52px; max-height: 52px; width: auto; display: block; object-fit: contain;" />
      </div>
      <div class="swipe-pill">
        <span>Смотреть разбор</span>
        <span class="swipe-arrow">→</span>
      </div>
    </div>
  </div>

</body>

</html>
