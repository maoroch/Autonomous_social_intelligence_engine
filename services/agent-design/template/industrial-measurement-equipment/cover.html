<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Testo carousel cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Значения ниже подставляются из IndustryProfile.brandGuidelines.colorPalette (см. index.ts).
         Дефолты — плейсхолдер-палитра из SKILL_testo_carousel_design.md, не официальный брендбук. */
      --testo-accent: {{ACCENT_COLOR}};
      --testo-ink: {{INK_COLOR}};
      --testo-paper: {{PAPER_COLOR}};
      --testo-steel: #4A535C;
      --testo-line: #DDE2E5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #e9e9e9;
      font-family: "Inter", sans-serif;
    }

    .stage {
      min-height: 1350px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
      margin: 0;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1350px;
      background-color: var(--testo-paper);
      background-image:
        linear-gradient(to right, var(--testo-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--testo-line) 1px, transparent 1px);
      background-size: 108px 108px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 168px 108px 108px;
      /* safe margin 64px+ учтён отступами padding + внутренними max-width текстовых блоков */
    }

    .badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 30px;
      height: 64px;
      border: 2px solid var(--testo-accent);
      border-radius: 8px;
      flex-shrink: 0;
      width: fit-content;
    }

    .badge span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 30px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--testo-accent);
      line-height: 1;
      white-space: nowrap;
    }

    .headline {
      position: relative;
      z-index: 1;
      margin: 56px 0 0;
      max-width: 820px;
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: 68px;
      line-height: 1.1;
      color: var(--testo-ink);
    }

    .body-text {
      position: relative;
      z-index: 1;
      margin: 28px 0 0;
      max-width: 860px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 38px;
      line-height: 1.4;
      color: var(--testo-steel);
    }

    .illustration-container {
      position: relative;
      z-index: 1;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 380px;
    }

    .illustration-container svg {
      height: 100%;
      width: auto;
    }

    .spacer {
      flex: 1 1 auto;
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--testo-line);
      padding-top: 28px;
    }

    .footer span {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 28px;
      color: var(--testo-steel);
      line-height: 1;
    }
  </style>
</head>

<body>

  <div class="stage">
    <div class="post">
      <div class="badge"><span>{{BADGE}}</span></div>

      <h1 class="headline">{{TITLE}}</h1>

      <p class="body-text">{{BODY}}</p>

      <div class="spacer"></div>

      <div class="illustration-container">
        {{ILLUSTRATION}}
      </div>

      <div class="footer">
        <span>{{FOOTER_LEFT}}</span>
        <span>{{PAGE_NUMBER}}</span>
      </div>
    </div>
  </div>

</body>

</html>
