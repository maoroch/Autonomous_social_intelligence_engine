<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Testo Carousel Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --testo-accent: {{ACCENT_COLOR}};
      --testo-ink: {{INK_COLOR}};
      --testo-paper: {{PAPER_COLOR}};
      --testo-orange: #FF7900;
      --testo-dark: #09090B;
      --testo-steel: #3F3F46;
      --testo-line: #E4E4E7;
    }

    * {
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      padding: 0;
      background: #F4F4F0;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      background: #F8F8F5;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 85px 80px 75px;
    }

    /* Ambient atmospheric studio lighting */
    .canvas::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -100px;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 121, 0, 0.16) 0%, rgba(255, 121, 0, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .canvas::after {
      content: "";
      position: absolute;
      bottom: 120px;
      left: -140px;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 180, 0, 0.12) 0%, rgba(255, 180, 0, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      position: relative;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 10px 24px;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .tag-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--testo-orange);
      box-shadow: 0 0 10px var(--testo-orange);
    }

    .tag-text {
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #18181B;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .issue-no {
      font-family: "IBM Plex Mono", monospace;
      font-size: 16px;
      font-weight: 700;
      color: #A1A1AA;
      letter-spacing: 0.05em;
    }

    /* Hero Section */
    .hero {
      z-index: 10;
      position: relative;
      margin-top: 36px;
    }

    .product-kicker {
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--testo-orange);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product-kicker::after {
      content: "";
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 121, 0, 0.4), rgba(255, 121, 0, 0.05));
    }

    .headline {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 68px;
      font-weight: 900;
      line-height: 1.08;
      color: var(--testo-dark);
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    /* Floating Frosted Glass Editorial Card */
    .editorial-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-left: 6px solid var(--testo-orange);
      border-radius: 28px;
      padding: 34px 38px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
      z-index: 10;
      position: relative;
      margin-top: 28px;
      margin-bottom: 24px;
    }

    .editorial-card p {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      color: var(--testo-steel);
      line-height: 1.42;
      letter-spacing: -0.01em;
    }

    /* Stat Pills Grid */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      z-index: 10;
      position: relative;
      margin-bottom: 30px;
    }

    .stat-pill {
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 22px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }

    .stat-label {
      font-size: 15px;
      font-weight: 700;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-sub {
      font-size: 14px;
      color: #A1A1AA;
      margin-top: 2px;
      font-weight: 500;
    }

    .stat-val {
      font-family: "Space Grotesk", sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #18181B;
      line-height: 1;
    }

    .stat-val span {
      color: var(--testo-orange);
      font-size: 24px;
      font-weight: 700;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding-top: 26px;
      z-index: 10;
      position: relative;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      height: 56px;
    }

    .footer-brand img {
      height: 52px;
      max-height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .swipe-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #18181B;
      color: #FFFFFF;
      padding: 16px 32px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .swipe-arrow {
      font-size: 20px;
      color: var(--testo-orange);
    }
  </style>
</head>

<body>

  <div class="canvas">
    <!-- Top Header -->
    <div class="header">
      <div class="tag-pill">
        <span class="tag-dot"></span>
        <span class="tag-text">{{BADGE}}</span>
      </div>
      <div class="issue-no">B2B CASE // {{PAGE_TEXT}}</div>
    </div>

    <!-- Hero Title -->
    <div class="hero">
      <div class="product-kicker">Testo Smart Diagnostics</div>
      <h1 class="headline">{{TITLE}}</h1>
    </div>

    <!-- Frosted Editorial Description Card -->
    <div class="editorial-card" style="{{BODY_STYLE}}">
      <p>{{BODY}}</p>
    </div>

    <!-- Spec Stats Bar -->
    <div class="stats-row">
      <div class="stat-pill">
        <div>
          <div class="stat-label">Сенсоры Longlife</div>
          <div class="stat-sub">Ресурс эксплуатации</div>
        </div>
        <div class="stat-val">6 <span>лет</span></div>
      </div>
      <div class="stat-pill">
        <div>
          <div class="stat-label">CO с H₂-компенсацией</div>
          <div class="stat-sub">Авторасширение</div>
        </div>
        <div class="stat-val">8000 <span>ppm</span></div>
      </div>
    </div>

    <!-- Footer with Logo and Swipe Pill -->
    <div class="footer">
      <div class="footer-brand">{{FOOTER_LEFT}}</div>
      <div class="swipe-pill">
        <span>Смотреть разбор</span>
        <span class="swipe-arrow">→</span>
      </div>
    </div>
  </div>

</body>

</html>
