apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: design-scaler
  namespace: linkedin-pipeline
spec:
  scaleTargetRef:
    name: agent-design
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 60
  pollingInterval: 5
  triggers:
    - type: redis
      metadata:
        address: redis.linkedin-pipeline.svc.cluster.local:6379
        listName: bull:queue-agent-design:wait
        listLength: "1"
