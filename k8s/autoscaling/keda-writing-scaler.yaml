apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: writing-scaler
  namespace: linkedin-pipeline
spec:
  scaleTargetRef:
    name: agent-writing
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 60
  pollingInterval: 5
  triggers:
    - type: redis
      metadata:
        address: redis.linkedin-pipeline.svc.cluster.local:6379
        listName: bull:queue-agent-writing:wait
        listLength: "1"
