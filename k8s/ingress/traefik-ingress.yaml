apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-ingress
  namespace: linkedin-pipeline
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /api/runs
            pathType: Prefix
            backend:
              service:
                name: web-dashboard
                port:
                  number: 3000
          - path: /openclaw
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-dashboard
                port:
                  number: 3000
