apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-writing
  namespace: linkedin-pipeline
  labels:
    app: agent-writing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-writing
  template:
    metadata:
      labels:
        app: agent-writing
    spec:
      containers:
        - name: agent-writing
          image: ghcr.io/maoroch/linkedin-ai-agent-writing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          env:
            - name: PORT
              value: "4004"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 10
