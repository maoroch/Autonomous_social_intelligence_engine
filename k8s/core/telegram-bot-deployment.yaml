apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: linkedin-pipeline
  labels:
    app: telegram-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
        - name: telegram-bot
          image: ghcr.io/maoroch/linkedin-ai-telegram-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4009
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          env:
            - name: PORT
              value: "4009"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4009
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 4009
            initialDelaySeconds: 5
            periodSeconds: 10
