name: CD Deploy (GHCR & Azure K3s)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/linkedin-ai

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: openclaw
            dir: services/openclaw
            dockerfile: Dockerfile.service
          - service: telegram-bot
            dir: services/telegram-bot
            dockerfile: Dockerfile.service
          - service: agent-trend
            dir: services/agent-trend-intelligence
            dockerfile: Dockerfile.service
          - service: agent-writing
            dir: services/agent-writing
            dockerfile: Dockerfile.service
          - service: agent-design
            dir: services/agent-design
            dockerfile: Dockerfile.service
          - service: agent-evaluator
            dir: services/agent-evaluator
            dockerfile: Dockerfile.service
          - service: agent-publishing
            dir: services/agent-publishing
            dockerfile: Dockerfile.service
          - service: web-dashboard
            dir: web-dashboard
            dockerfile: Dockerfile.dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          build-args: |
            SERVICE_DIR=${{ matrix.dir }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy to Azure K3s Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.AZURE_VM_HOST != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Azure K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.AZURE_VM_HOST }}
          username: ${{ vars.AZURE_VM_USER || 'azureuser' }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /home/azureuser/linkedin_ai-agent_tool || exit 1
            git pull origin main
            kubectl apply -k k8s/
            kubectl rollout restart deployment -n linkedin-pipeline
            kubectl get pods -n linkedin-pipeline
