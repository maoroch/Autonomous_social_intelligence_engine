name: CI Pipeline

on:
  push:
    branches: [main, dev-version]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Library
        run: npm run build -w shared-lib

      - name: Build Services
        run: |
          npm run build -w services/telegram-bot
          npm run build -w services/agent-writing
          npm run build -w services/agent-trend-intelligence
          npm run build -w services/agent-design
          npm run build -w services/agent-evaluator
          npm run build -w services/agent-publishing
          npm run build -w services/openclaw

      - name: Run Unit Tests
        run: |
          npx tsx --test services/telegram-bot/src/__tests__/*.test.ts \
            services/agent-trend-intelligence/src/__tests__/*.test.ts \
            services/agent-design/src/__tests__/*.test.ts

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.service
          build-args: SERVICE_DIR=services/openclaw
          push: false
          tags: openclaw:ci-test

      - name: Build Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          tags: web-dashboard:ci-test
