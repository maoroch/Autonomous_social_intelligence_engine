name: linkedin-ai-pipeline

services:
  redis:
    image: redis:7-alpine
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:6.0
    command: mongod --setParameter diagnosticDataCollectionEnabled=false --nojournal
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/openclaw
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      AGENT_DESIGN_URL: http://agent-design:4005
      MAX_RETRIES_PER_STAGE: 2
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  agent-trend:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-trend-intelligence
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-positioning:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-positioning
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-strategy:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-content-strategy
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-writing:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-writing
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-design:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-design
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-seo:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-seo
    ports:
      - "4006:4006"
    environment:
      PORT: 4006
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-publishing:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-publishing
    ports:
      - "4007:4007"
    environment:
      PORT: 4007
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_OWNER_URN: ${LINKEDIN_OWNER_URN:-}
    depends_on:
      redis:
        condition: service_healthy

  agent-evaluator:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/agent-evaluator
    ports:
      - "4008:4008"
    environment:
      PORT: 4008
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
    depends_on:
      redis:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_DIR: services/telegram-bot
    ports:
      - "4009:4009"
    environment:
      PORT: 4009
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      OPENCLAW_PUBLIC_BASE_URL: http://openclaw:4000
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3005:3000"
    environment:
      OPENCLAW_URL: http://openclaw:4000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: linkedin_pipeline
    depends_on:
      - openclaw

volumes:
  redis_data:
  mongo_data:
